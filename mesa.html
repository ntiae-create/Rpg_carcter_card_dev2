<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mesa RPG</title>

    <!-- CSS -->
    <link rel="stylesheet" href="mesa.css">
    <link rel="stylesheet" href="passivas.css">
    <link rel="stylesheet" href="mesa-diagnostico.css">
</head>

<body>

<main id="online-table-panel" class="mesa-container">

    <!-- CABEÇALHO -->
    <header class="mesa-header">
        <div class="mesa-title">
            <h1>🎲 Mesa RPG</h1>
            <span id="nome-campanha">Campanha</span>
        </div>

        <div class="mesa-header-actions">
            <button id="btn-diagnostico" class="mesa-diagnostico-btn" type="button" title="Diagnóstico da Mesa">
                🔧
            </button>
            <button id="btn-configuracoes" class="mesa-settings-btn" type="button" title="Configurações da Mesa">
                ⚙️
            </button>
        </div>
    </header>

    <!-- ÁREA PRINCIPAL -->
    <section class="mesa-layout">

        <!-- JOGADORES (8 slots) -->
        <section id="jogadores" class="jogadores-grid" aria-label="Jogadores da Mesa">
            <!-- Os 8 cards de jogador continuam iguais ao seu original -->
            <!-- (vou manter a estrutura que você já tinha) -->
        </section>

        <!-- ÁREA CENTRAL DA MESA -->
        <section id="mesa-screen" class="mesa-screen">
            <div id="mesa-screen-content" class="mesa-screen-content">
                <!-- Conteúdo dinâmico (mapa, dungeon, combate etc) -->
            </div>
        </section>

    </section>

    <!-- DIAGNÓSTICO (lateral) -->
    <aside id="painel-diagnostico" class="painel-diagnostico" hidden>
        <!-- Seu conteúdo de diagnóstico continua aqui -->
    </aside>

</main>

<!-- =====================================================
     ORDEM CORRETA DE CARREGAMENTO DOS SCRIPTS
====================================================== -->

<!-- 1. Biblioteca do Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- 2. Configuração do Supabase (cria o cliente) -->
<script src="supabase.js"></script>

<!-- 3. Camadas de acesso Supabase -->
<script src="supabase-entrada.js"></script>
<script src="supabase-mesa.js"></script>

<!-- 4. Núcleo da Mesa -->
<script src="config-mesa.js"></script>
<script src="mesa.js"></script>
<script src="mesa-entrada.js"></script>
<script src="mesa-online.js"></script>
<script src="mesa-jogadores.js"></script>
<script src="mesa-aventura.js"></script>
<script src="mesa-ficha-modal.js"></script>
<script src="button-mesa.js"></script>
<script src="mesa-diagnostico.js"></script>

<!-- 5. Sistemas de combate / passivas -->
<script src="passivas-dados.js"></script>
<script src="passivas-stacks.js"></script>
<script src="passivas-efeitos.js"></script>
<script src="passivas.js"></script>
<script src="sistema-dano.js"></script>

<!-- 6. Inicialização final (depois de tudo carregado) -->
<script>
document.addEventListener("DOMContentLoaded", () => {
    console.log("[Mesa] Todos os scripts carregados. Inicializando...");

    // Garante que o SupabaseMesa está pronto
    if (window.SupabaseMesa && typeof window.SupabaseMesa.inicializar === "function") {
        window.SupabaseMesa.inicializar();
    }

    // Dispara evento para os módulos saberem que podem começar
    document.dispatchEvent(new CustomEvent("mesa:pronto"));
});
</script>

</body>
</html>
